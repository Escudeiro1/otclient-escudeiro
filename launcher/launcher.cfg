# otclient-launcher configuration
# Lines starting with # are comments. Keys are case-sensitive.

# Required: the update-manifest endpoint. Must be https:// (see
# allow_insecure_http below for local testing only).
update_url=

# Executable name of the game client, resolved relative to the launcher's
# own directory.
client_executable=otclient

# Extra arguments passed through to the client on launch.
client_args=

# Optional: path to a custom CA bundle for the update server's certificate.
# Leave empty to use the system default trust store.
ca_cert_path=

# Local testing only: allows plain http:// update/download URLs and never
# be set to 1/true against a real update server.
allow_insecure_http=0
